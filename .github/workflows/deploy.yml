name: Deploy App Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
      AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
      AIO_RUNTIME_APIHOST: https://adobeioruntime.net
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install AIO CLI
        run: npm install -g @adobe/aio-cli

      - name: Obtain IMS access token (OAuth S2S client credentials)
        env:
          CLIENT_ID: ${{ secrets.IMS_OAUTH_S2S_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.IMS_OAUTH_S2S_CLIENT_SECRET }}
          SCOPES: ${{ secrets.IMS_OAUTH_S2S_SCOPES }}
        run: |
          RESPONSE=$(curl -s -X POST "https://ims-na1.adobelogin.com/ims/token/v3" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&scope=${SCOPES}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "::error::IMS token fetch failed: $(echo "$RESPONSE" | jq -r '.error_description // .error // "unknown error"')"
            exit 1
          fi

          echo "::add-mask::${TOKEN}"
          echo "AIO_IMS_CONTEXTS_CLI_ACCESS__TOKEN_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          EXPIRY=$(( $(date +%s%3N) + 1800000 ))
          echo "AIO_IMS_CONTEXTS_CLI_ACCESS__TOKEN_EXPIRY=${EXPIRY}" >> "$GITHUB_ENV"

      - name: Create .env for deployment
        env:
          IMS_OAUTH_S2S_CLIENT_ID: ${{ secrets.IMS_OAUTH_S2S_CLIENT_ID }}
          IMS_OAUTH_S2S_CLIENT_SECRET: ${{ secrets.IMS_OAUTH_S2S_CLIENT_SECRET }}
          IMS_OAUTH_S2S_ORG_ID: ${{ secrets.IMS_OAUTH_S2S_ORG_ID }}
          IMS_OAUTH_S2S_SCOPES: ${{ secrets.IMS_OAUTH_S2S_SCOPES }}
          COMMERCE_API_BASE_URL: ${{ secrets.COMMERCE_API_BASE_URL }}
          COMMERCE_STORE_CODE: ${{ secrets.COMMERCE_STORE_CODE }}
        run: |
          echo "AIO_runtime_namespace=$AIO_RUNTIME_NAMESPACE" >> .env
          echo "AIO_runtime_auth=$AIO_RUNTIME_AUTH" >> .env
          echo "IMS_OAUTH_S2S_CLIENT_ID=$IMS_OAUTH_S2S_CLIENT_ID" >> .env
          echo "IMS_OAUTH_S2S_CLIENT_SECRET=$IMS_OAUTH_S2S_CLIENT_SECRET" >> .env
          echo "IMS_OAUTH_S2S_ORG_ID=$IMS_OAUTH_S2S_ORG_ID" >> .env
          echo "IMS_OAUTH_S2S_SCOPES=$IMS_OAUTH_S2S_SCOPES" >> .env
          echo "COMMERCE_API_BASE_URL=$COMMERCE_API_BASE_URL" >> .env
          echo "COMMERCE_STORE_CODE=$COMMERCE_STORE_CODE" >> .env

      - name: Deploy
        env:
          COMMERCE_API_BASE_URL: ${{ secrets.COMMERCE_API_BASE_URL }}
          COMMERCE_STORE_CODE: ${{ secrets.COMMERCE_STORE_CODE }}
        run: aio app deploy

      - name: Verify deployment
        env:
          AIO_IMS_CONTEXTS_CLI_ORG_ID: ${{ secrets.IMS_OAUTH_S2S_ORG_ID }}
        run: aio runtime action list
